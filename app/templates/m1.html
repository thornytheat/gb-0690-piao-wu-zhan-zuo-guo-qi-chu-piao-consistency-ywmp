{% extends "base.html" %}{% block content %}<div class="console-grid"><section class="panel seat-panel"><div class="panel__head"><h2>席位分布</h2><span>16 SEATS</span></div><div class="stage-line">STAGE / 舞台</div><div class="seat-board">{% for seat in seats %}<div class="seat {% if seat.state=='已出票' %}sold{% elif seat.state=='待出票' %}paid{% endif %}" title="{{seat.seat}} / {{seat.state}}"><b>{{seat.seat}}</b><small>{{seat.state}}</small></div>{% endfor %}</div><div class="seat-legend"><span>● 已出票</span><span>○ 待出票</span><span>· 已过期</span></div></section><section class="panel"><div class="panel__head"><h2>渠道事件流</h2><span>CSV</span></div><form id="events"><label>事件内容<textarea name="text" spellcheck="false">{{sample}}</textarea></label><label>文件<input name="file" type="file" accept=".csv"></label><label>观测终点<input name="observation_end" value="{{defaults.observation_end}}"></label><label>迟到阈值 min<input name="late_minutes" value="{{defaults.late_minutes}}"></label><button class="button primary">RUN / 回放</button></form></section><section class="panel wide"><div class="panel__head"><h2>隔离事件</h2><span>{{result.quarantine|length}} ROWS</span></div>{{rows(result.quarantine,['line','key','code','reason','detail'])}}</section></div>{% endblock %}
