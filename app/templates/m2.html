{% extends "base.html" %}{% block content %}<div class="console-grid"><section class="panel seat-panel"><div class="panel__head"><h2>席位分布</h2><span>16 SEATS</span></div><div class="stage-line">STAGE / 舞台</div><div class="seat-board">{% for seat in seats %}<div class="seat {% if seat.state=='已出票' %}sold{% elif seat.state=='待出票' %}paid{% endif %}" title="{{seat.seat}} / {{seat.state}}"><b>{{seat.seat}}</b><small>{{seat.state}}</small></div>{% endfor %}</div><div class="seat-legend"><span>● 已出票</span><span>○ 待出票</span><span>· 已过期</span></div></section><section class="panel"><div class="panel__head"><h2>座席映射凭据</h2></div>{{rows(data.rows,['id','channel','seat','order','version'])}}</section></div>{% endblock %}
